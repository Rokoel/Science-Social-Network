{% extends "base.html" %}
{% block title %}Project Feed{% endblock %}

{% block content %}
<div class="tinder-feed-container">
    <div id="tinder-card-stack"></div>
    <div id="tinder-feed-loader" style="text-align:center; display:none; margin:2rem 0;">
        <span>Loading more projects...</span>
    </div>
</div>
{% endblock %}

{% block head %}
<style>
.tinder-feed-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 2rem 0;
}
.tinder-card-stack {
    position: relative;
    min-height: 600px;
}
.tinder-card {
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    overflow: hidden;
    margin-bottom: 2rem;
    display: flex;
    flex-direction: column;
    min-height: 600px;
}
.tinder-card-image {
    width: 100%;
    height: 300px;
    background-size: cover;
    background-position: center;
}
.tinder-card-image.generic {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #f1f1f1;
}
.tinder-card-image.generic img {
    max-width: 60%;
    max-height: 80%;
    opacity: 0.7;
}
.tinder-card-content {
    padding: 2rem;
    flex: 1;
    display: flex;
    flex-direction: column;
}
.tinder-project-title {
    font-size: 2rem;
    margin-bottom: 0.5rem;
    color: var(--primary-color);
}
.tinder-project-tags {
    margin-bottom: 1rem;
}
.tinder-tag {
    display: inline-block;
    background: var(--primary-color);
    color: #fff;
    border-radius: 12px;
    padding: 0.25em 0.75em;
    font-size: 0.9em;
    margin-right: 0.5em;
    margin-bottom: 0.5em;
}
.tinder-project-description {
    font-size: 1.1rem;
    margin-bottom: 1rem;
}
.tinder-project-goals {
    font-size: 1rem;
    margin-bottom: 1rem;
}
.tinder-project-meta {
    font-size: 0.95rem;
    color: #666;
    margin-bottom: 1.5rem;
    display: flex;
    justify-content: space-between;
}
.tinder-card-actions {
    margin-top: auto;
    text-align: center;
}
.tinder-feed-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 2rem;
}
.tinder-no-projects {
    text-align: center;
    padding: 4rem 0;
}
@media (max-width: 700px) {
    .tinder-feed-container {
        max-width: 100%;
        padding: 1rem 0;
    }
    .tinder-card-content {
        padding: 1rem;
    }
    .tinder-card {
        min-height: 400px;
    }
    .tinder-card-image {
        height: 180px;
    }
}
</style>
{% endblock %}

{% block scripts %}
<script>
const PROJECTS_PER_LOAD = 3;
let loadedProjects = [];
let loading = false;
let offset = 0;
let totalProjects = null;
let currentIndex = 0;

function renderProjectCard(project, index) {
    let tagsHtml = '';
    if (project.tags && project.tags.length) {
        tagsHtml = project.tags.map(tag => `<span class="tinder-tag">${tag}</span>`).join(' ');
    }
    let imageHtml = '';
    if (project.image) {
        console.log(project);
        if (project.image.includes('.svg')) {
            imageHtml = `<div class="tinder-card-image generic">
                            <img src="${project.image}" alt="${project.title}">
                        </div>`;
        } else {
            imageHtml = `<div class="tinder-card-image" style="background-image: url('${project.image}');">
                        </div>`;
            }
    } else {
        imageHtml = `<div class="tinder-card-image generic">
                        <img src="{{ url_for('static', filename='uploads/default-project.svg') }}" alt="Generic Project">
                    </div>`;
    }
    return `
    <div class="tinder-card" data-index="${index}">
        ${imageHtml}
        <div class="tinder-card-content">
            <h2 class="tinder-project-title">${project.title}</h2>
            <div class="tinder-project-tags">${tagsHtml}</div>
            <p class="tinder-project-description">${project.description || ''}</p>
            <h4>Goals</h4>
            <p class="tinder-project-goals">${project.goals || ''}</p>
            <div class="tinder-project-meta">
                <span>By <a href="${project.creator ? '/users/view/' + project.creator.id : '#'}">${project.creator ? project.creator.username : ''}</a></span>
                <span>Deadline: ${project.deadline || 'N/A'}</span>
            </div>
            <div class="tinder-card-actions">
                <a href="${project.apply_url}" class="btn btn-success btn-lg">Apply</a>
                <a href="${project.view_url}" class="btn btn-secondary btn-lg">View</a>
            </div>
        </div>
    </div>
    `;
}

function renderCards() {
    const stack = document.getElementById('tinder-card-stack');
    stack.innerHTML = '';
    if (loadedProjects.length === 0) {
        stack.innerHTML = `<div class="tinder-no-projects">
            <h2>No more projects to show!</h2>
            <p>Try updating your tags or check back later.</p>
        </div>`;
        return;
    }
    // Only show one card at a time (like Tinder)
    if (loadedProjects[currentIndex]) {
        stack.innerHTML = renderProjectCard(loadedProjects[currentIndex], currentIndex);
    }
}

function loadMoreProjects() {
    if (loading) return;
    loading = true;
    document.getElementById('tinder-feed-loader').style.display = 'block';
    fetch(`/projects/feed_ajax?offset=${loadedProjects.length}&limit=${PROJECTS_PER_LOAD}`)
        .then(response => response.json())
        .then(data => {
            totalProjects = data.total;
            loadedProjects = loadedProjects.concat(data.projects);
            document.getElementById('tinder-feed-loader').style.display = 'none';
            loading = false;
            renderCards();
        });
}

function showNextProject() {
    if (currentIndex < loadedProjects.length - 1) {
        currentIndex++;
        renderCards();
        // If we're near the end, load more
        if (loadedProjects.length - currentIndex <= 2 && (totalProjects === null || loadedProjects.length < totalProjects)) {
            loadMoreProjects();
        }
    }
}

function showPrevProject() {
    if (currentIndex > 0) {
        currentIndex--;
        renderCards();
    }
}

document.addEventListener('DOMContentLoaded', function() {
    // Initial load
    loadMoreProjects();

    // Keyboard navigation
    document.addEventListener('keydown', function(e) {
        if (e.key === "ArrowLeft") showPrevProject();
        if (e.key === "ArrowRight") showNextProject();
    });

    // Touch swipe navigation
    let touchStartX = null;
    let touchEndX = null;
    const threshold = 50;
    const cardStack = document.getElementById('tinder-card-stack');
    if (cardStack) {
        cardStack.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].screenX;
        });
        cardStack.addEventListener('touchend', function(e) {
            touchEndX = e.changedTouches[0].screenX;
            if (touchStartX !== null && touchEndX !== null) {
                if (touchEndX - touchStartX > threshold) showPrevProject();
                else if (touchStartX - touchEndX > threshold) showNextProject();
            }
            touchStartX = null;
            touchEndX = null;
        });
    }

    // Optional: Add next/prev buttons for accessibility
    const nav = document.createElement('div');
    nav.className = 'tinder-feed-nav';
    nav.innerHTML = `
        <button class="btn btn-secondary btn-lg" id="tinder-prev-btn">Previous</button>
        <button class="btn btn-primary btn-lg" id="tinder-next-btn">Next</button>
    `;
    document.querySelector('.tinder-feed-container').appendChild(nav);
    document.getElementById('tinder-prev-btn').onclick = showPrevProject;
    document.getElementById('tinder-next-btn').onclick = showNextProject;
});
</script>
{% endblock %}
